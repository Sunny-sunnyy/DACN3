[project]
name = "shopping-assistant-v3"
version = "0.1.0"
description = "Shopping Assistant V3 — Vietnamese-speaking US Deal Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]
neural = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]
frontier = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.0.0",
]
specialist = [
    "modal>=0.60.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
